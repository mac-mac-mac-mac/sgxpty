name: Daily SORA Rate Sync

on:
  schedule:
    # 02:00 UTC = 10:00 AM SGT (SGT is UTC+8)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repo

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest SORA Rate
        run: node scripts/update-sora.mjs

      - name: Commit & Push Updated sora.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/sora.json
          git diff-index --quiet HEAD || (git commit -m "chore: automated daily SORA update" && git push)
