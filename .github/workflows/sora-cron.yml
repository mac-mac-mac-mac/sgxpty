name: Daily SORA Rate Sync

on:
  schedule:
    # 02:00 UTC = 10:00 AM Singapore Time (UTC+8)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Scripts folder:"
          ls -la scripts

      - name: Fetch Latest SORA Rate
        run: node ./scripts/update-sora.mjs

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/sora.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: automated daily SORA update"
          git push
