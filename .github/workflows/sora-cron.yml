name: Daily SORA Rate Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: sora-sync
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show Node version
        run: node --version

      - name: Update SORA
        run: node scripts/update-sora.mjs

      - name: Commit changes
        run: |
          if [ ! -f public/sora.json ]; then
            echo "public/sora.json was not created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/sora.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update SORA rate"
          git push
