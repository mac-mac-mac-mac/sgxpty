name: Update SGX Prices

on:
  schedule:
    # 5:30pm SGT = 09:30 UTC, Monday–Friday
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install yahoo-finance2
        run: npm install yahoo-finance2@latest

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Commit updated prices
        run: |
          git config user.name "SGXPTY Bot"
          git config user.email "sgxpty-bot@users.noreply.github.com"
          git add src/data/prices.json
          git diff --staged --quiet || git commit -m "prices: SGX close $(date -u '+%Y-%m-%d')"
          git push
