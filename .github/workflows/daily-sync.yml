name: Daily Price & SORA Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5"  # 5:30 PM SGT, Mon–Fri

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update SORA
        run: node scripts/update-sora.mjs

      - name: Update US rates & FX
        run: node scripts/update-rates.mjs

      - name: Fetch prices + append history
        run: node scripts/fetch-prices.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            public/sora.json \
            public/rates.json \
            src/data/prices.json \
            src/data/history/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          git commit -m "prices: ${DATE}"
          # Discard leftover noise (e.g. package-lock.json from npm install)
          git checkout -- .

          # Retry: if main moved while we were running, rebase onto it and
          # keep OUR freshly generated data on any conflict (-X theirs = the
          # commit being replayed during a rebase).
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Failed to push after 3 attempts."
          exit 1
